services:
  auth-service:
    build: ./backend/services/auth-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite:////app/data/auth.db
      JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:-dev-only-insecure-secret-change-me-please-really}
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      - auth-data:/app/data
      - ./backend/services/auth-service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  products-service:
    build: ./backend/services/products-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: sqlite:////app/data/products.db
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      - products-data:/app/data
      - ./backend/services/products-service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  orders-service:
    build: ./backend/services/orders-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: sqlite:////app/data/orders.db
      JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:-dev-only-insecure-secret-change-me-please-really}
      PRODUCTS_SERVICE_URL: http://products-service:8002/api/v1
      # Test-mode Stripe keys only (sk_test_... / whsec_...) — never put a
      # live key here, this is a learning project. Get a free test key at
      # https://dashboard.stripe.com/test/apikeys after creating an account.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      - orders-data:/app/data
      - ./backend/services/orders-service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    depends_on:
      - products-service

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - auth-service
      - products-service
      - orders-service

volumes:
  auth-data:
  products-data:
  orders-data:
