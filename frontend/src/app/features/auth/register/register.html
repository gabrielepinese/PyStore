<div class="auth-page">
  <div class="auth-panel">
    <div class="auth-card">
      <a class="back-link" routerLink="/dashboard"
        ><fa-icon [icon]="icons.angleLeft" aria-hidden="true" /> Back to dashboard</a
      >

      <span class="brand">dumbEcommerce</span>

      <p class="greeting">Get started</p>
      <h1>Create account</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input
            id="fullName"
            type="text"
            formControlName="fullName"
            autocomplete="name"
            placeholder="Jane Doe"
            aria-describedby="fullName-error"
            [attr.aria-invalid]="form.controls.fullName.invalid && form.controls.fullName.touched"
          />
          <p
            id="fullName-error"
            class="field-error"
            aria-live="polite"
            [class.is-visible]="form.controls.fullName.invalid && form.controls.fullName.touched"
          >
            Enter your name.
          </p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="test@gmail.com"
            aria-describedby="email-error"
            [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          <p
            id="email-error"
            class="field-error"
            aria-live="polite"
            [class.is-visible]="form.controls.email.invalid && form.controls.email.touched"
          >
            Enter a valid email address.
          </p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="••••••••••"
              aria-describedby="password-error"
              [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()"
            >
              <fa-icon [icon]="showPassword() ? icons.eyeSlash : icons.eye" aria-hidden="true" />
            </button>
          </div>
          <p
            id="password-error"
            class="field-error"
            aria-live="polite"
            [class.is-visible]="form.controls.password.invalid && form.controls.password.touched"
          >
            Password must be at least 8 characters.
          </p>
        </div>

        <p class="form-error" role="alert" [class.is-visible]="!!errorMessage()">
          {{ errorMessage() }}
        </p>

        <div class="submit-row">
          <app-button [disabled]="isSubmitting()">Create account</app-button>
          @if (isSubmitting()) {
            <app-dot-loader />
          }
        </div>
      </form>

      <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>

  <div class="illustration-panel" aria-hidden="true">
    <svg class="deco-ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(26,26,26,0.15)" stroke-width="1" />
    </svg>

    <svg class="illustration" viewBox="0 0 320 340" fill="none">
      <!-- overlapping planes, same row -->
      <rect x="0" y="100" width="140" height="140" rx="2" fill="#1A1A1A" opacity="0.08" />
      <rect x="45" y="80" width="140" height="140" rx="2" fill="#C5A059" opacity="0.45" />
      <rect x="90" y="110" width="140" height="140" rx="2" fill="#1A1A1A" opacity="0.65" />
      <rect x="135" y="85" width="140" height="140" rx="2" fill="#C5A059" opacity="0.3" />
      <rect x="180" y="115" width="120" height="120" rx="2" fill="#1A1A1A" opacity="0.15" />
    </svg>
  </div>
</div>
